name: Release

on:
  push:
    branches:
      - main

# Never let two releases run at once. A second push waits rather than racing
# the first one to the registry.
concurrency:
  group: release-${{ github.ref }}

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # changesets/action opens and updates the release pull request.
      contents: write
      pull-requests: write
      # Lets npm attach a provenance statement to the published package.
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Changesets needs the history to work out what to release.
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # The website and the examples type-check against the built entry points,
      # so this has to come before the checks.
      - name: Build
        run: pnpm run build

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Type-check
        run: pnpm run type-check

      - name: Test
        run: pnpm run test

      - name: Version or publish
        uses: changesets/action@v1
        with:
          version: pnpm run cs:ver
          publish: pnpm run cs:pub
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
